name: Org Self-Prompt

on:
  schedule:
    - cron: '0 23 * * *' # 08:00 JST
    - cron: '0 4 * * *' # 13:00 JST
    - cron: '0 10 * * *' # 19:00 JST
  workflow_dispatch:

permissions:
  contents: read
  issues: read

jobs:
  generate-candidate:
    name: Generate self-prompt candidate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      GH_TOKEN: ${{ github.token }}
      ORG_REPO: ${{ github.repository }}
      ORG_SELF_PROMPT_LIMIT: 50

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify self-prompt regression tests
        run: |
          bash -n ops/self-prompt.sh
          bash ops/test_self_prompt.sh
          bash ops/test_self_prompt_automation.sh

      - name: Generate proposal-only candidate
        run: |
          mkdir -p artifacts
          bash ops/self-prompt.sh > artifacts/self-prompt.md

      - name: Write job summary
        run: |
          {
            echo "## Org Self-Prompt"
            echo ""
            echo "- Schedule: 08:00 / 13:00 / 19:00 JST"
            echo "- Mode: proposal-only"
            echo "- Mutation: none"
            echo ""
            cat artifacts/self-prompt.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload self-prompt artifact
        uses: actions/upload-artifact@v4
        with:
          name: org-self-prompt-${{ github.run_id }}
          path: artifacts/self-prompt.md
          retention-days: 14
