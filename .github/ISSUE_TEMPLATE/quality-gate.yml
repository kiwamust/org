name: Quality Gate（品質ゲート結果）
description: Operations局QAD本部の Quality Inspector が起票する品質ゲート検査結果
title: "QG: "
labels: ["org:type/quality-gate", "org:quality/gate-pending"]
body:
  - type: input
    id: target-ref
    attributes:
      label: 検査対象
      description: "対象の TASK/PJ Issue 番号（例: #5）"
    validations:
      required: true
  - type: dropdown
    id: data-profile
    attributes:
      label: data_profile
      description: 検査対象の Evidence Strictness
      options:
        - ES-0
        - ES-1
        - ES-2
        - ES-3
        - ES-4
    validations:
      required: true
  - type: dropdown
    id: gate-type
    attributes:
      label: ゲート種別
      options:
        - IQG（入力品質）
        - PQG（中間品質）
        - OQG（出力品質）
        - MVP experiment gate
        - Proposal / compliance gate
        - Research quality gate
        - Data / privacy gate
    validations:
      required: true
  - type: textarea
    id: required-evidence
    attributes:
      label: required_evidence
      description: Data-Evidence / Work / Life の確認対象
      value: |
        Data-Evidence:
        Work:
        Life:
        Missing:
    validations:
      required: true
  - type: textarea
    id: checklist
    attributes:
      label: 検査結果
      description: "チェックリストの各項目に OK/NG と不良コード・メモを記録。横断不良は Q01-Q08 を使用"
      value: |
        | No | 項目 | 判定 | 不良コード | メモ |
        | --: | ---- | :--: | ---------- | ---- |
        | 1 |  | OK/NG |  |  |
    validations:
      required: true
  - type: dropdown
    id: result
    attributes:
      label: 判定結果
      options:
        - pending
        - 合格（gate-pass）
        - 不合格（gate-fail）
        - waived（owner/reason/expiry/risk acceptance 必須）
    validations:
      required: true
  - type: textarea
    id: waiver
    attributes:
      label: waiver details
      description: waived の場合のみ必須。ES-4 は原則不可
      value: |
        owner:
        reason:
        expiry:
        risk_acceptance:
    validations:
      required: false
  - type: textarea
    id: rework-instructions
    attributes:
      label: 差し戻し指示
      description: 不合格の場合の修正指示（不良コード + 具体的な修正内容）
    validations:
      required: false
  - type: dropdown
    id: next-circulation
    attributes:
      label: next_circulation
      options:
        - Data-Evidence
        - Work
        - Life
        - Org
        - Codex
        - me
    validations:
      required: true
