name: Organization Project（組織プロジェクト）
description: dispatch が起票するプロジェクト Issue
title: "PJ: "
labels: ["org:type/project", "org:phase/intake", "org:status/green"]
body:
  - type: input
    id: directive-ref
    attributes:
      label: 元 Directive
      description: "元の Directive Issue 番号（例: #1）"
    validations:
      required: true
  - type: input
    id: parent-project
    attributes:
      label: parent_project
      description: "Life parent Issue / project ref。ない場合は none と理由"
    validations:
      required: true
  - type: input
    id: work-ref
    attributes:
      label: work_ref
      description: "Work Vault index / output ref。ない場合は none と理由"
    validations:
      required: true
  - type: dropdown
    id: gbt-class
    attributes:
      label: GBT 分類
      options:
        - Generation（価値探索・仮説生成）
        - Behavior（計画・実装・テスト）
        - Target（成果物完成・配信）
    validations:
      required: true
  - type: dropdown
    id: dept
    attributes:
      label: 主担当局
      options:
        - R&D局
        - Brand局
        - EmergingTech局
        - Engineering局
        - Operations局
        - Cross（部門横断）
    validations:
      required: true
  - type: dropdown
    id: quality-level
    attributes:
      label: 品質レベル
      options:
        - Draft
        - Standard
        - Premium
        - Scientific
    validations:
      required: true
  - type: dropdown
    id: data-profile
    attributes:
      label: data_profile
      description: Evidence Strictness
      options:
        - ES-0
        - ES-1
        - ES-2
        - ES-3
        - ES-4
    validations:
      required: true
  - type: dropdown
    id: role
    attributes:
      label: role
      options:
        - Strategist Agent
        - Research Agent
        - Drafting Agent
        - QA Gate Agent
        - Sales Agent
        - Research Writing Agent
        - Data Steward Agent
        - Codex Executor
    validations:
      required: true
  - type: textarea
    id: charter
    attributes:
      label: プロジェクトチャーター
      description: 目的、DoD、スコープ、体制、制約
    validations:
      required: true
  - type: textarea
    id: issue-contract
    attributes:
      label: Issue contract
      description: phase / expected_return / gate / closeout_evidence / next_circulation
      value: |
        phase: intake
        expected_return:
        input_refs:
          -
        constraints:
          -
        gate:
          type: UQG
          status: pending
          required_evidence:
            -
        closeout_evidence:
          artifact_refs:
            -
          trace_refs:
            -
          verification_result:
        next_circulation:
    validations:
      required: true
  - type: textarea
    id: qcd-contract
    attributes:
      label: QCD contract
      description: Quality / Cost / Delivery の運用契約。Standard 以上では必須
      value: |
        qcd:
          quality_target:
            gate_type:
            pass_condition:
            defect_budget:
          delivery_target:
            next_checkpoint:
            target_close:
            batch_size:
          cost_budget:
            wip_slots: 1
            review_budget:
            codex_run_budget:
          leading_indicators:
            -
          stop_rules:
            -
    validations:
      required: true
  - type: textarea
    id: wip-check
    attributes:
      label: WIP / stop check
      description: Active parent <=3, active tasks <=7, ES-3/4 external artifacts <=2, trace plan
      value: |
        active_parent_project_count:
        active_org_task_count:
        active_es3_es4_external_artifact_count:
        trace_or_verification_plan:
    validations:
      required: false
  - type: textarea
    id: task-breakdown
    attributes:
      label: タスク分解
      description: タスク一覧と担当エージェント
    validations:
      required: false
